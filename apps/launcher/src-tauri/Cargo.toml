[package]
name = "nodeclient"
version = "0.1.14"
edition = "2021"

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
nodeclient-types.workspace = true
nodeclient-auth.workspace = true
nodeclient-profiles.workspace = true
nodeclient-core.workspace = true
nodeclient-java.workspace = true
nodeclient-process.workspace = true
nodeclient-downloader.workspace = true
dotenvy = "0.15"
open = "5"
rfd = "0.15"
sysinfo = "0.33"
fastnbt = "2.6.3"
flate2 = "1.1.10"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
